name: CI

# Single, necessary automation: lint + release gate across supported Pythons.
# Runs on the GitHub mirror (github.com/Morningstar202604/ScholarSeed); GitCode/Gitee
# are read-only mirrors without runners, so no platform-specific workflow
# duplicates are maintained (see docs/VERSIONING.md release discipline).
#
# Deliberately avoids pipx: it resolves the system interpreter rather than
# the setup-python one (known cross-runner pitfall). `python -m pip` +
# `python -m ruff` work identically on any runner that has Python.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff (pinned)
        run: python -m pip install --disable-pip-version-check ruff==0.13.2
      - name: Lint
        run: python -m ruff check .
      - name: Release gate (plugin validation + unit tests)
        run: python scripts/release_gate.py
